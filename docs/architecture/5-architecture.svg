<text class="s halo" x="752" y="72" text-anchor="middle">comments, pull requests</text>
<path class="edge" d="M520 298 V368" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text class="s halo" x="528" y="338" text-anchor="start">records</text>
<path class="edge" d="M410 420 H168 Q160 420 160 412 V302" marker-end="url(#ah)"/>
<text class="s halo" x="285" y="412" text-anchor="middle">numbers</text>
<path class="edge" d="M580 298 V332 Q580 340 588 340 H872 Q880 340 880 348 V368" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text class="s halo" x="730" y="332" text-anchor="middle">tests on base and head, verdict</text>
<rect class="card" x="50" y="32" width="220" height="96" rx="12"/>
<path class="cardfoot" d="M50 100 H270 V116 Q270 128 258 128 H62 Q50 128 50 116 Z"/>
<line class="tick" x1="50" y1="100" x2="270" y2="100"/>
<rect class="tile warn" x="64" y="46" width="36" height="36" rx="9"/>
<circle class="glyph warn" cx="82" cy="60" r="4.5"/><path class="glyph warn" d="M74 73 Q82 63 90 73"/>
<text class="h" x="112" y="62">People</text>
<text class="s" x="112" y="80">file, decide, merge</text>
<circle class="glyphfill warn" cx="68" cy="114" r="3.5"/>
<text class="s strong" x="78" y="118">decide at two gates</text>
<rect class="card" x="410" y="32" width="220" height="96" rx="12"/>
<path class="cardfoot" d="M410 100 H630 V116 Q630 128 618 128 H422 Q410 128 410 116 Z"/>
<line class="tick" x1="410" y1="100" x2="630" y2="100"/>
<rect class="tile muted" x="424" y="46" width="36" height="36" rx="9"/>
<circle class="glyph muted" cx="442" cy="64" r="8"/><circle class="glyphfill muted" cx="442" cy="64" r="2.2"/>
<text class="h" x="472" y="62">GitHub</text>
<text class="s" x="472" y="80">issues · pull requests</text>
<circle class="glyphfill muted" cx="428" cy="114" r="3.5"/>
<text class="s strong" x="438" y="118">system of record</text>
<rect class="card" x="50" y="202" width="220" height="96" rx="12"/>
<path class="cardfoot" d="M50 270 H270 V286 Q270 298 258 298 H62 Q50 298 50 286 Z"/>
<line class="tick" x1="50" y1="270" x2="270" y2="270"/>
<rect class="tile muted" x="64" y="216" width="36" height="36" rx="9"/>
<rect class="glyph muted" x="73" y="227" width="18" height="14" rx="2"/><path class="glyph muted" d="M73 231 H91"/>
<text class="h" x="112" y="232">Results</text>
<text class="s" x="112" y="250">API · dashboard pages</text>
<circle class="glyphfill muted" cx="68" cy="284" r="3.5"/>
<text class="s strong" x="78" y="288">read-only</text>
<rect class="card" x="410" y="202" width="220" height="96" rx="12"/>
<path class="cardfoot" d="M410 270 H630 V286 Q630 298 618 298 H422 Q410 298 410 286 Z"/>
<line class="tick" x1="410" y1="270" x2="630" y2="270"/>
