<path class="glyph muted" d="M434 235 A8 8 0 0 1 448 228"/><path class="glyph muted" d="M445 226 L449 228 L447 232"/><path class="glyph muted" d="M450 233 A8 8 0 0 1 436 240"/><path class="glyph muted" d="M439 242 L435 240 L437 236"/>
<text class="h" x="472" y="232">Orchestrator</text>
<text class="s" x="472" y="250">the Bug Smasher service</text>
<circle class="glyphfill muted" cx="428" cy="284" r="3.5"/>
<text class="s strong" x="438" y="288">one cycle a minute</text>
<rect class="card" x="770" y="202" width="220" height="96" rx="12"/>
<path class="cardfoot" d="M770 270 H990 V286 Q990 298 978 298 H782 Q770 298 770 286 Z"/>
<line class="tick" x1="770" y1="270" x2="990" y2="270"/>
