<text class="s strong" x="438" y="458">only what GitHub can't hold</text>
<rect class="card" x="770" y="372" width="220" height="96" rx="12"/>
<path class="cardfoot" d="M770 440 H990 V456 Q990 468 978 468 H782 Q770 468 770 456 Z"/>
<line class="tick" x1="770" y1="440" x2="990" y2="440"/>
<rect class="tile ok" x="784" y="386" width="36" height="36" rx="9"/>
<path class="glyph ok" d="M802 395 L810 398 V405 Q810 411 802 414 Q794 411 794 405 V398 Z"/><path class="glyph ok" d="M798 404 L801 407 L806 401"/>
<text class="h" x="832" y="402">Verifier</text>
<text class="s" x="832" y="420">repo's test image</text>
<circle class="glyphfill ok" cx="788" cy="454" r="3.5"/>
<text class="s strong" x="798" y="458">fails before, passes after</text>
</g>
</svg>
