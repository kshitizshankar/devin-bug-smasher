<polygon class="glyph accent" points="802,225 810,229.5 810,238.5 802,243 794,238.5 794,229.5"/><circle class="glyphfill accent" cx="802" cy="234" r="2.5"/>
<text class="h" x="832" y="232">Devin sessions</text>
<text class="s" x="832" y="250">triage, then fix</text>
<circle class="glyphfill accent" cx="788" cy="284" r="3.5"/>
<text class="s strong" x="798" y="288">one session per bug</text>
