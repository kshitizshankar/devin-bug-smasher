<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 704" width="1040" height="704" class="fig">
<style>svg{
    color-scheme: light;
    --bg: #ffffff; --text: #1f2328; --muted: #59636e; --faint: #818b98; --rule: #e3e6ea;
    --quote-bg: #f7f8fa; --link: #0b5cad; --code-bg: #f3f4f6;
    --fig-group: #fbfcfd; --fig-box: #f4f6f8; --fig-stroke: #cfd5dc; --fig-muted: #6b7480;
    --fig-accent: #3b5bdb; --fig-accent-soft: #e8edfd;
    --fig-warn: #b26a00; --fig-warn-soft: #fff1d6;
    --fig-ok: #1f7a4d; --fig-ok-soft: #e3f4ea;
    --fig-bad: #b42318; --fig-bad-soft: #fde8e7;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --grid: #e7e9ec; --axis: #c3c7cd; --good: #006300; --surface: #ffffff;
  }
@media (prefers-color-scheme: dark){svg{
    color-scheme: dark;
    --bg: #121417; --text: #e6e8eb; --muted: #a4acb6; --faint: #7d8591; --rule: #2b3037;
    --quote-bg: #181b1f; --link: #7cb4f0; --code-bg: #1d2126;
    --fig-group: #15181c; --fig-box: #1b1f24; --fig-stroke: #3a424c; --fig-muted: #9aa3ad;
    --fig-accent: #8aa2ff; --fig-accent-soft: #1c2444;
    --fig-warn: #f0b35a; --fig-warn-soft: #33260f;
    --fig-ok: #5fcf8e; --fig-ok-soft: #12291c;
    --fig-bad: #ff8a80; --fig-bad-soft: #3a1714;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --grid: #262b31; --axis: #3a414a; --good: #0ca30c; --surface: #121417;
  }}
.fig text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
.fig .h { font-size: 15px; font-weight: 650; }
.fig .t { font-size: 13px; }
.fig .s { font-size: 12px; fill: var(--fig-muted); }
.fig .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: var(--fig-muted); }
.fig .group { fill: var(--fig-group); stroke: var(--fig-stroke); stroke-width: 1; }
.fig .box { fill: var(--fig-box); stroke: var(--fig-stroke); stroke-width: 1; }
.fig .box.accent { fill: var(--fig-accent-soft); stroke: var(--fig-accent); }
.fig .box.warn { fill: var(--fig-warn-soft); stroke: var(--fig-warn); }
.fig .box.ok { fill: var(--fig-ok-soft); stroke: var(--fig-ok); }
.fig .box.bad { fill: var(--fig-bad-soft); stroke: var(--fig-bad); }
.fig .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: var(--text); }
.fig text.ok { fill: var(--fig-ok); font-weight: 600; }
.fig .box.dashed { stroke-dasharray: 4 3; }
.fig .edge { fill: none; stroke: var(--fig-muted); stroke-width: 1.5; }
.fig .edge.accent { stroke: var(--fig-accent); }
.fig .edge.warn { stroke: var(--fig-warn); stroke-dasharray: 5 4; }
.fig .edge.dashed { stroke-dasharray: 5 4; }
.fig .edge.dotted { stroke: var(--fig-accent); stroke-dasharray: 2 4; stroke-width: 1.5; }
.fig .tick { fill: none; stroke: var(--fig-stroke); stroke-width: 1; }
.fig .big { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
.fig .strong { font-weight: 650; fill: var(--text); }
.fig .s1 { fill: var(--series-1); }
.fig .s2 { fill: var(--series-2); }
.fig .s3 { fill: var(--series-3); }
.fig .s4 { fill: var(--series-4); }
.fig .ring { stroke: var(--surface); stroke-width: 2; }
.fig .grid { stroke: var(--grid); stroke-width: 1; }
.fig .axis { stroke: var(--axis); stroke-width: 1; }
.fig .num { font-variant-numeric: tabular-nums; }
.fig .hero { font-size: 56px; font-weight: 700; letter-spacing: -0.02em; fill: var(--text); }
.fig .good { fill: var(--good); font-weight: 600; }
.fig .spark { fill: none; stroke: var(--fig-muted); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.fig .spark-end { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }
.fig .dashed-line { stroke-dasharray: 4 4; }
.fig .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.fig .canvas { fill: var(--fig-group); stroke: var(--fig-stroke); }
.fig .card { fill: var(--bg); stroke: var(--fig-stroke); stroke-width: 1; }
.fig .strong-card { stroke: var(--fig-muted); stroke-width: 1.6; }
.fig .cardfoot { fill: var(--fig-box); }
.fig .tile { fill: var(--fig-box); }
.fig .tile.accent { fill: var(--fig-accent-soft); }
.fig .tile.ok { fill: var(--fig-ok-soft); }
.fig .tile.warn { fill: var(--fig-warn-soft); }
.fig .glyph { fill: none; stroke: var(--fig-muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fig .glyph.accent { stroke: var(--fig-accent); }
.fig .glyph.ok { stroke: var(--fig-ok); }
.fig .glyph.warn { stroke: var(--fig-warn); }
.fig .glyphfill { fill: var(--fig-muted); }
.fig .glyphfill.accent { fill: var(--fig-accent); }
.fig .glyphfill.ok { fill: var(--fig-ok); }
.fig .glyphfill.warn { fill: var(--fig-warn); }
.ah { fill: var(--fig-muted); }
.ah.accent { fill: var(--fig-accent); }
.ah.warn { fill: var(--fig-warn); }.dotgrid { fill: var(--rule); }
</style>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah accent" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah warn" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="dotgrid" cx="2" cy="2" r="1"/>
    </pattern>
  </defs>
<rect x="0" y="0" width="1040.0" height="704.0" rx="12" style="fill:var(--bg)"/>
<g class="fig">
<title id="fseq">One bug, end to end: every call between the person, GitHub, Bug Smasher, Devin and Docker</title>
<line class="tick dashed-line" x1="90" y1="58" x2="90" y2="698"/>
<line class="tick dashed-line" x1="300" y1="58" x2="300" y2="698"/>
<line class="tick dashed-line" x1="520" y1="58" x2="520" y2="698"/>
<line class="tick dashed-line" x1="740" y1="58" x2="740" y2="698"/>
<line class="tick dashed-line" x1="950" y1="58" x2="950" y2="698"/>
<rect class="box warn" x="15" y="20" width="150" height="38" rx="8"/>
<text class="h" x="90" y="44" text-anchor="middle">Person</text>
<rect class="box " x="225" y="20" width="150" height="38" rx="8"/>
<text class="h" x="300" y="44" text-anchor="middle">GitHub</text>
<rect class="box ok" x="445" y="20" width="150" height="38" rx="8"/>
<text class="h" x="520" y="44" text-anchor="middle">Bug Smasher</text>
<rect class="box accent" x="665" y="20" width="150" height="38" rx="8"/>
<text class="h" x="740" y="44" text-anchor="middle">Devin</text>
<rect class="box dashed" x="875" y="20" width="150" height="38" rx="8"/>
<text class="h" x="950" y="44" text-anchor="middle">Docker</text>
<line class="grid" x1="0" y1="72" x2="1040" y2="72"/>
<text class="s strong halo" x="4" y="85">Triage</text>
<path class="edge" d="M93 96 H297" marker-end="url(#ah)"/>
<text class="s halo" x="195" y="90" text-anchor="middle">1 · adds the needs-triage label</text>
<path class="edge" d="M517 126 H303" marker-end="url(#ah)"/>
<text class="s halo" x="410" y="120" text-anchor="middle">2 · reads labels and comments</text>
<path class="edge" d="M523 156 H737" marker-end="url(#ah)"/>
<text class="s halo" x="630" y="150" text-anchor="middle">3 · starts a session with the Playbook</text>
<path class="edge accent" d="M737 186 H303" marker-end="url(#ah-accent)"/>
<text class="s halo" x="520" y="180" text-anchor="middle">4 · clones the repository, posts the triage comment</text>
<path class="edge accent dashed" d="M737 216 H523" marker-end="url(#ah-accent)"/>
<text class="m halo" x="630" y="210" text-anchor="middle">5 · triage_complete</text>
<line class="grid" x1="0" y1="245" x2="1040" y2="245"/>
<text class="s strong halo" x="4" y="258">Decision</text>
<path class="edge" d="M93 268 H297" marker-end="url(#ah)"/>
<text class="s halo" x="195" y="262" text-anchor="middle">6 · adds bug-smasher, or a rule does</text>
<path class="edge" d="M523 298 H737" marker-end="url(#ah)"/>
<text class="s halo" x="630" y="292" text-anchor="middle">7 · sends the fix to the same session</text>
<line class="grid" x1="0" y1="327" x2="1040" y2="327"/>
<text class="s strong halo" x="4" y="340">Fix</text>
<path class="edge accent" d="M737 350 H303" marker-end="url(#ah-accent)"/>
<text class="s halo" x="520" y="344" text-anchor="middle">8 · pushes a branch, opens a pull request</text>
<path class="edge accent dashed" d="M737 380 H523" marker-end="url(#ah-accent)"/>
<text class="m halo" x="630" y="374" text-anchor="middle">9 · pr_opened</text>
<line class="grid" x1="0" y1="409" x2="1040" y2="409"/>
<text class="s strong halo" x="4" y="422">Verify</text>
<path class="edge" d="M517 432 H303" marker-end="url(#ah)"/>
<text class="s halo" x="410" y="426" text-anchor="middle">10 · fetches the diff and both commits</text>
<path class="edge" d="M523 462 H947" marker-end="url(#ah)"/>
<text class="s halo" x="735" y="456" text-anchor="middle">11 · runs the new tests on base and head</text>
<path class="edge" d="M517 492 H303" marker-end="url(#ah)"/>
<text class="s halo" x="410" y="486" text-anchor="middle">12 · posts the verification status</text>
<path class="edge" d="M523 522 H737" marker-end="url(#ah)"/>
<text class="s halo" x="630" y="516" text-anchor="middle">13 · requests Devin Review</text>
<path class="edge accent" d="M737 552 H303" marker-end="url(#ah-accent)"/>
<text class="s halo" x="520" y="546" text-anchor="middle">14 · Devin Review comments; the session fixes them</text>
<line class="grid" x1="0" y1="581" x2="1040" y2="581"/>
<text class="s strong halo" x="4" y="594">Merge</text>
<path class="edge" d="M93 604 H297" marker-end="url(#ah)"/>
<text class="s halo" x="195" y="598" text-anchor="middle">15 · merges on GitHub</text>
<path class="edge" d="M517 634 H303" marker-end="url(#ah)"/>
<text class="s halo" x="410" y="628" text-anchor="middle">16 · or a merge rule does it</text>
<path class="edge" d="M523 664 H947" marker-end="url(#ah)"/>
<text class="s halo" x="735" y="658" text-anchor="middle">17 · verifies the merged commit</text>
</g>
</svg>
